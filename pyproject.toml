[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "A small coding agent with local workspace tools and OpenAI-compatible tool calling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.12,<1.0",
]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "openai"
ignore_missing_imports = true
